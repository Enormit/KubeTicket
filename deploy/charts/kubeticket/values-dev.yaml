serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/kubeticket-dev-app"

externalSecrets:
  enabled: true
  remoteSecretName: "kubeticket/dev/secrets"

config:
  APP_ENV: "staging"
  LOG_LEVEL: "info"
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "2"
  DB_SIMPLE_PROTOCOL: "true"
  REDIS_MODE: "standalone"
  COOKIE_SECURE: "true"
  SQS_ORDER_QUEUE_URL: ""
  CORS_ALLOWED_ORIGINS: "https://dev.kubeticket.example.com"

frontendConfig:
  NEXT_PUBLIC_API_URL: ""
  NEXT_PUBLIC_WS_URL: "wss://dev.kubeticket.example.com"
  BACKEND_INTERNAL_URL: ""

services:
  gateway-api:
    replicaCount: 2
    image:
      repository: "ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket/gateway-api"
      tag: "dev"
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
  flashsale-engine:
    replicaCount: 2
    image:
      repository: "ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket/flashsale-engine"
      tag: "dev"
    autoscaling:
      minReplicas: 2
      maxReplicas: 5
  order-worker:
    replicaCount: 2
    image:
      repository: "ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket/order-worker"
      tag: "dev"
  frontend:
    replicaCount: 2
    image:
      repository: "ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket/frontend"
      tag: "dev"
    autoscaling:
      minReplicas: 2
      maxReplicas: 4

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: "/api/runtime-config"
  hosts:
    - "dev.kubeticket.example.com"

migration:
  enabled: true
  image:
    repository: "ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket/db-migrator"
    tag: "dev"

keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 6

monitoring:
  serviceMonitor:
    enabled: true
