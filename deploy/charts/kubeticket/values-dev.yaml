serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::755272426779:role/kubeticket-dev-app"

externalSecrets:
  enabled: true
  remoteSecretName: "kubeticket/dev/secrets"

config:
  APP_ENV: "staging"
  LOG_LEVEL: "info"
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "2"
  DB_SIMPLE_PROTOCOL: "true"
  REDIS_MODE: "standalone"
  COOKIE_SECURE: "true"
  SQS_ORDER_QUEUE_URL: "https://sqs.ap-southeast-1.amazonaws.com/755272426779/kubeticket-dev-orders.fifo"
  CORS_ALLOWED_ORIGINS: "https://dev.enormitpham.me"

frontendConfig:
  NEXT_PUBLIC_API_URL: ""
  NEXT_PUBLIC_WS_URL: "wss://dev.enormitpham.me"
  BACKEND_INTERNAL_URL: ""

services:
  gateway-api:
    replicaCount: 2
    image:
      repository: "755272426779.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket-dev/gateway-api"
      tag: "dev"
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
  flashsale-engine:
    replicaCount: 2
    image:
      repository: "755272426779.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket-dev/flashsale-engine"
      tag: "dev"
    autoscaling:
      minReplicas: 2
      maxReplicas: 5
  order-worker:
    replicaCount: 2
    image:
      repository: "755272426779.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket-dev/order-worker"
      tag: "dev"
  frontend:
    replicaCount: 2
    image:
      repository: "755272426779.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket-dev/frontend"
      tag: "dev"
    autoscaling:
      minReplicas: 2
      maxReplicas: 4

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-southeast-1:755272426779:certificate/17d62362-b78b-4141-a7ee-d005a028981f"
    alb.ingress.kubernetes.io/healthcheck-path: "/api/runtime-config"
  hosts:
    - "dev.enormitpham.me"

migration:
  enabled: true
  image:
    repository: "755272426779.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket-dev/db-migrator"
    tag: "dev"

keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 6
  sqs:
    queueURL: "https://sqs.ap-southeast-1.amazonaws.com/755272426779/kubeticket-dev-orders.fifo"

monitoring:
  serviceMonitor:
    enabled: true
