serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/kubeticket-prod-app"

externalSecrets:
  enabled: true
  remoteSecretName: "kubeticket/prod/secrets"

config:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  DB_MAX_CONNS: "20"
  DB_MIN_CONNS: "5"
  DB_SIMPLE_PROTOCOL: "true"
  REDIS_MODE: "standalone"
  SEAT_HOLD_TTL_SECONDS: "300"
  CHECKOUT_HOLD_TTL_SECONDS: "900"
  QUEUE_ADMISSION_RATE: "100"
  COOKIE_SECURE: "true"
  SQS_ORDER_QUEUE_URL: ""
  CORS_ALLOWED_ORIGINS: "https://kubeticket.example.com"

frontendConfig:
  NEXT_PUBLIC_API_URL: ""
  NEXT_PUBLIC_WS_URL: "wss://kubeticket.example.com"
  BACKEND_INTERNAL_URL: ""

services:
  gateway-api:
    replicaCount: 3
    image:
      repository: "ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket/gateway-api"
      tag: "latest"
    autoscaling:
      minReplicas: 3
      maxReplicas: 15
    pdb:
      minAvailable: 2
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"
  flashsale-engine:
    replicaCount: 3
    image:
      repository: "ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket/flashsale-engine"
      tag: "latest"
    autoscaling:
      minReplicas: 3
      maxReplicas: 25
    pdb:
      minAvailable: 2
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "1Gi"
  order-worker:
    replicaCount: 2
    image:
      repository: "ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket/order-worker"
      tag: "latest"
    pdb:
      minAvailable: 1
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"
  frontend:
    replicaCount: 2
    image:
      repository: "ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket/frontend"
      tag: "latest"
    autoscaling:
      minReplicas: 2
      maxReplicas: 10
    pdb:
      minAvailable: 1
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: "/api/runtime-config"
  hosts:
    - "kubeticket.example.com"

migration:
  enabled: true
  image:
    repository: "ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/kubeticket/db-migrator"
    tag: "latest"

keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 30
  sqs:
    queueLength: 20

monitoring:
  serviceMonitor:
    enabled: true
