externalSecrets:
  enabled: false

secrets:
  existingSecret: ""
  data:
    DATABASE_URL: "postgresql://kubeticket:kubeticket@postgres:5432/kubeticket?sslmode=disable"
    NEON_DATABASE_DIRECT_URL: "postgresql://kubeticket:kubeticket@postgres:5432/kubeticket?sslmode=disable"
    REDIS_URL: "redis://redis:6379/0"
    JWT_SECRET: "local-dev-jwt-secret"
    TICKET_QR_HMAC_SECRET: "local-dev-qr-hmac-secret"
    TURNSTILE_SECRET_KEY: ""
    STRIPE_SECRET_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""

config:
  APP_ENV: "development"
  LOG_LEVEL: "debug"
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "2"
  DB_SIMPLE_PROTOCOL: "false"
  REDIS_MODE: "standalone"
  COOKIE_SECURE: "false"
  SQS_ORDER_QUEUE_URL: ""
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080,http://kubeticket.local"

frontendConfig:
  NEXT_PUBLIC_API_URL: ""
  NEXT_PUBLIC_WS_URL: ""
  BACKEND_INTERNAL_URL: ""

services:
  gateway-api:
    replicaCount: 1
    image:
      repository: "kubeticket/gateway-api"
      tag: "dev"
      pullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "128Mi"
  flashsale-engine:
    replicaCount: 1
    image:
      repository: "kubeticket/flashsale-engine"
      tag: "dev"
      pullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
  order-worker:
    replicaCount: 1
    image:
      repository: "kubeticket/order-worker"
      tag: "dev"
      pullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "128Mi"
  frontend:
    replicaCount: 1
    image:
      repository: "kubeticket/frontend"
      tag: "dev"
      pullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "256Mi"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - "kubeticket.local"

# Enable and point sqlConfigMap to a ConfigMap containing db/migrations/*.up.sql
# when running migrations inside local kind/k3d instead of `make migrate-up`.
migration:
  enabled: false
  seedEnabled: true
  sqlConfigMap: "kubeticket-migrations"
  image:
    repository: "postgres"
    tag: "16-alpine"
    pullPolicy: "IfNotPresent"
