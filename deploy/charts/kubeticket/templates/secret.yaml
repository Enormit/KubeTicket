{{- if and (not .Values.externalSecrets.enabled) (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeticket.secretName" . }}
  labels:
    {{- include "kubeticket.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := keys .Values.secrets.data | sortAlpha }}
  {{ $key }}: {{ index $.Values.secrets.data $key | toString | b64enc | quote }}
  {{- end }}
{{- end }}
