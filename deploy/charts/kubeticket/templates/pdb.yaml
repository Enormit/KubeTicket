{{- $fullname := include "kubeticket.fullname" . }}
{{- $first := true }}
{{- range $name := keys .Values.services | sortAlpha }}
{{- $svc := index $.Values.services $name }}
{{- if and $svc.enabled $svc.pdb $svc.pdb.enabled }}
{{ if not $first }}
---
{{ end -}}
{{- $first = false }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-{{ $name }}
  labels:
    {{- include "kubeticket.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if hasKey $svc.pdb "minAvailable" }}
  minAvailable: {{ $svc.pdb.minAvailable }}
  {{- else if hasKey $svc.pdb "maxUnavailable" }}
  maxUnavailable: {{ $svc.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "kubeticket.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}
