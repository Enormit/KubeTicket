{{- if .Values.monitoring.serviceMonitor.enabled }}
{{- $fullname := include "kubeticket.fullname" . }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "kubeticket.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: app.kubernetes.io/component
  selector:
    matchLabels:
      {{- include "kubeticket.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- range $name := keys .Values.services | sortAlpha }}
          {{- $svc := index $.Values.services $name }}
          {{- if and $svc.enabled $svc.metrics $svc.metrics.enabled }}
          - {{ $name }}
          {{- end }}
          {{- end }}
  endpoints:
    - port: http
      path: {{ .Values.config.PROMETHEUS_METRICS_PATH | default "/metrics" }}
      interval: {{ .Values.monitoring.serviceMonitor.interval | default "15s" }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}
