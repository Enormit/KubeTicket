{{- if and .Values.externalSecrets.enabled (not .Values.secrets.existingSecret) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "kubeticket.fullname" . }}-external-secret
  labels:
    {{- include "kubeticket.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | quote }}
  target:
    name: {{ include "kubeticket.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $key := .Values.externalSecrets.keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.externalSecrets.remoteSecretName | quote }}
        property: {{ $key }}
    {{- end }}
{{- end }}
