nameOverride: ""
fullnameOverride: ""
revisionHistoryLimit: 3
imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  name: ""
  annotations: {}

# Sensitive credentials (NEVER commit real production values here).
# - EKS (dev/prod): keep externalSecrets.enabled=true to sync from AWS Secrets Manager.
# - Pre-provisioned secret: set secrets.existingSecret to an existing K8s Secret name.
# - Local testing: override externalSecrets.enabled=false and secrets.data in values-local.yaml.
secrets:
  existingSecret: ""
  data: {}

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: "aws-secrets-manager"
    kind: "ClusterSecretStore"
  remoteSecretName: "kubeticket/prod/secrets"
  keys:
    - DATABASE_URL
    - NEON_DATABASE_DIRECT_URL
    - REDIS_URL
    - JWT_SECRET
    - TICKET_QR_HMAC_SECRET
    - TURNSTILE_SECRET_KEY
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET

# Non-sensitive runtime configuration for Go services (services/pkg/config/config.go).
# Secrets (DATABASE_URL, REDIS_URL, JWT_SECRET, TICKET_QR_HMAC_SECRET,
# TURNSTILE_SECRET_KEY, STRIPE_*) stay in Secret/ExternalSecret.
# Per-service fields (PORT, APP_NAME) are injected directly in Deployment.
config:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "2"
  DB_SIMPLE_PROTOCOL: "true"
  REDIS_MODE: "standalone"
  SEAT_HOLD_TTL_SECONDS: "300"
  CHECKOUT_HOLD_TTL_SECONDS: "900"
  QUEUE_ADMISSION_RATE: "50"
  JWT_EXPIRES_IN: "24h"
  COOKIE_SECURE: "true"
  AWS_REGION: "ap-southeast-1"
  SQS_ORDER_QUEUE_URL: ""
  PAYMENT_PROVIDER: "stripe"
  PAYMENT_WEBHOOK_TOLERANCE_SECONDS: "300"
  PROMETHEUS_METRICS_PATH: "/metrics"
  CORS_ALLOWED_ORIGINS: "https://kubeticket.example.com"

# Non-sensitive runtime configuration for the Next.js frontend.
# Leave BACKEND_INTERNAL_URL empty to auto-resolve to http://<fullname>-gateway-api:8080.
frontendConfig:
  NEXT_PUBLIC_API_URL: ""
  NEXT_PUBLIC_WS_URL: ""
  BACKEND_INTERNAL_URL: ""

# Multi-service workload definitions rendered by templates/deployment.yaml and templates/service.yaml.
services:
  gateway-api:
    enabled: true
    isFrontend: false
    replicaCount: 2
    image:
      repository: "kubeticket/gateway-api"
      tag: "latest"
      pullPolicy: "IfNotPresent"
    port: 8080
    serviceType: "ClusterIP"
    terminationGracePeriodSeconds: 30
    probes:
      livenessPath: "/healthz"
      readinessPath: "/readyz"
    metrics:
      enabled: true
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 15
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

  flashsale-engine:
    enabled: true
    isFrontend: false
    replicaCount: 2
    image:
      repository: "kubeticket/flashsale-engine"
      tag: "latest"
      pullPolicy: "IfNotPresent"
    port: 8081
    serviceType: "ClusterIP"
    terminationGracePeriodSeconds: 60
    probes:
      livenessPath: "/healthz"
      readinessPath: "/readyz"
    metrics:
      enabled: true
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 20
      targetCPUUtilizationPercentage: 65
      targetMemoryUtilizationPercentage: 75
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 10
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 20
              periodSeconds: 60
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"

  order-worker:
    enabled: true
    isFrontend: false
    replicaCount: 2
    image:
      repository: "kubeticket/order-worker"
      tag: "latest"
      pullPolicy: "IfNotPresent"
    port: 8082
    serviceType: "ClusterIP"
    terminationGracePeriodSeconds: 30
    probes:
      livenessPath: "/healthz"
      readinessPath: "/readyz"
    metrics:
      enabled: true
    autoscaling:
      enabled: false
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

  frontend:
    enabled: true
    isFrontend: true
    replicaCount: 2
    image:
      repository: "kubeticket/frontend"
      tag: "latest"
      pullPolicy: "IfNotPresent"
    port: 3000
    serviceType: "ClusterIP"
    terminationGracePeriodSeconds: 30
    probes:
      livenessPath: "/api/runtime-config"
      readinessPath: "/api/runtime-config"
    metrics:
      enabled: false
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 75
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# Ingress routing aligned with docker/nginx/default.conf using explicit Prefix paths
# so both NGINX Ingress (local) and AWS ALB Ingress (EKS) behave identically.
ingress:
  enabled: true
  className: "alb"
  annotations: {}
  hosts:
    - "kubeticket.example.com"
  tls: []
  routes:
    - path: "/ws"
      pathType: "Prefix"
      service: "flashsale-engine"
    - path: "/api/v1/waiting-room"
      pathType: "Prefix"
      service: "flashsale-engine"
    - path: "/api/v1/holds"
      pathType: "Prefix"
      service: "flashsale-engine"
    - path: "/api/v1/checkout"
      pathType: "Prefix"
      service: "flashsale-engine"
    - path: "/api/v1/webhooks"
      pathType: "Prefix"
      service: "order-worker"
    - path: "/api/v1/payments"
      pathType: "Prefix"
      service: "order-worker"
    - path: "/api"
      pathType: "Prefix"
      service: "gateway-api"
    - path: "/"
      pathType: "Prefix"
      service: "frontend"

# Pre-install / pre-upgrade SQL migration Job (Helm Hook).
migration:
  enabled: true
  seedEnabled: false
  sqlConfigMap: ""
  backoffLimit: 3
  activeDeadlineSeconds: 300
  image:
    repository: "kubeticket/db-migrator"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"

# Event-driven autoscaling for order-worker via KEDA + AWS SQS FIFO.
keda:
  enabled: true
  pollingInterval: 10
  cooldownPeriod: 120
  minReplicaCount: 2
  maxReplicaCount: 20
  sqs:
    queueURL: ""
    queueLength: 25
    identityOwner: "pod"
  authenticationRef: {}

# Prometheus Operator ServiceMonitor scraping /metrics from Go services.
monitoring:
  serviceMonitor:
    enabled: true
    interval: "15s"
    scrapeTimeout: "10s"
    additionalLabels:
      release: kube-prometheus-stack
