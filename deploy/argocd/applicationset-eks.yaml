apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubeticket-eks
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
            namespace: kubeticket-dev
            valuesFile: values-dev.yaml
            targetRevision: main
            clusterServer: https://kubernetes.default.svc
          - env: prod
            namespace: kubeticket-prod
            valuesFile: values-prod.yaml
            targetRevision: main
            clusterServer: https://kubernetes.default.svc
  template:
    metadata:
      name: "kubeticket-{{ .env }}"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: kubeticket
        environment: "{{ .env }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/Enormit/KubeTicket.git
        targetRevision: "{{ .targetRevision }}"
        path: deploy/charts/kubeticket
        helm:
          releaseName: "kubeticket-{{ .env }}"
          valueFiles:
            - "{{ .valuesFile }}"
      destination:
        server: "{{ .clusterServer }}"
        namespace: "{{ .namespace }}"
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        {{- if eq .env "dev" }}
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        {{- end }}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
