global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway-api
    static_configs:
      - targets: ["gateway-api:8080"]
  - job_name: flashsale-engine
    static_configs:
      - targets: ["flashsale-engine:8081"]
  - job_name: order-worker
    static_configs:
      - targets: ["order-worker:8082"]
