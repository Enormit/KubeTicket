apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubeticket-alerts
  labels:
    app.kubernetes.io/part-of: kubeticket
    release: kube-prometheus-stack
spec:
  groups:
    - name: kubeticket.http
      rules:
        - alert: KubeTicketHigh5xxErrorRate
          expr: |
            sum by (service) (rate(http_requests_total{status=~"5.."}[2m]))
            / clamp_min(sum by (service) (rate(http_requests_total[2m])), 0.001) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High 5xx error rate on {{ $labels.service }}"
            description: "Service {{ $labels.service }} 5xx error ratio exceeded 5% for 2m (current: {{ $value | humanizePercentage }})."

        - alert: KubeTicketHighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
            ) > 0.5
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "High p95 HTTP latency on {{ $labels.service }}"
            description: "Service {{ $labels.service }} p95 latency is {{ $value | humanizeDuration }} (> 500ms)."

    - name: kubeticket.flashsale
      rules:
        - alert: KubeTicketOrderWorkerQueueRetries
          expr: |
            sum(rate(queue_messages_processed_total{status=~"retry|permanent_error"}[5m])) > 0.5
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Order worker queue failures increasing"
            description: "Order worker retry/permanent_error rate is {{ $value | printf \"%.2f\" }} msg/s over 5m."

        - alert: KubeTicketOrderWorkerPermanentFailures
          expr: |
            sum(increase(queue_messages_processed_total{status="permanent_error"}[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Permanent order processing failure detected"
            description: "order-worker dropped {{ $value | printf \"%.0f\" }} message(s) with permanent_error in the last 5m."

        - alert: KubeTicketHighSeatLockConflicts
          expr: |
            sum by (event_id) (rate(seat_lock_conflicts_total[2m])) > 50
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "High seat lock contention on event {{ $labels.event_id }}"
            description: "Seat lock conflict rate is {{ $value | printf \"%.1f\" }}/s on event {{ $labels.event_id }}."

    - name: kubeticket.kubernetes
      rules:
        - alert: KubeTicketPodCrashLooping
          expr: |
            max_over_time(
              kube_pod_container_status_waiting_reason{namespace=~"kubeticket-.*", reason="CrashLoopBackOff"}[5m]
            ) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is CrashLoopBackOff"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is stuck in CrashLoopBackOff."

        - alert: KubeTicketPodNotReady
          expr: |
            sum by (namespace, pod) (
              kube_pod_status_ready{namespace=~"kubeticket-.*", condition="true"}
            ) == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has reported Ready=false for more than 3 minutes."
