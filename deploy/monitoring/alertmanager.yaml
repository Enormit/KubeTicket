global:
  resolve_timeout: 5m

route:
  receiver: telegram-alerts
  group_by: ["alertname", "namespace", "service"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 1h
  routes:
    - matchers:
        - severity = "critical"
      receiver: telegram-alerts
      repeat_interval: 15m

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity =~ "warning|info"
    equal: ["alertname", "namespace", "service"]

receivers:
  - name: telegram-alerts
    telegram_configs:
      - send_resolved: true
        # Mount TELEGRAM_BOT_TOKEN as a secret file in Alertmanager Pod (never commit tokens).
        bot_token_file: /etc/alertmanager/secrets/telegram-bot-token
        # Replace with your numeric TELEGRAM_CHAT_ID (negative ID for groups/channels).
        chat_id: -1000000000000
        parse_mode: HTML
        message: |
          <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b>
          <b>Severity:</b> {{ .CommonLabels.severity }}
          {{- if .CommonLabels.namespace }}<b>Namespace:</b> {{ .CommonLabels.namespace }}{{- end }}
          {{- if .CommonLabels.service }}<b>Service:</b> {{ .CommonLabels.service }}{{- end }}
          {{- range .Alerts }}
          • {{ .Annotations.summary }}
            {{ .Annotations.description }}
          {{- end }}
