stages:
  - test
  - oidc
  - build
  - gitops

variables:
  AWS_DEFAULT_REGION: "ap-southeast-1"
  DOCKER_TLS_CERTDIR: "/certs"

test_go:
  stage: test
  image: golang:1.27-alpine
  script:
    - cd services
    - go vet ./pkg/... ./gateway-api/... ./flashsale-engine/... ./order-worker/...
    - go test -v ./pkg/... ./gateway-api/... ./flashsale-engine/... ./order-worker/...

test_frontend:
  stage: test
  image: node:22-alpine
  cache:
    key: "${CI_COMMIT_REF_SLUG}-npm"
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npx tsc --noEmit
    - npm test

lint_helm:
  stage: test
  image:
    name: alpine/helm:3.17.2
    entrypoint: [""]
  script:
    - helm lint deploy/charts/kubeticket -f deploy/charts/kubeticket/values-local.yaml
    - helm lint deploy/charts/kubeticket -f deploy/charts/kubeticket/values-dev.yaml
    - helm lint deploy/charts/kubeticket -f deploy/charts/kubeticket/values-prod.yaml

verify_aws_oidc:
  stage: oidc
  image:
    name: amazon/aws-cli:2.22.0
    entrypoint: [""]
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://gitlab.com
  script:
    - |
      if [ -z "${AWS_ROLE_ARN:-}" ]; then
        echo "AWS_ROLE_ARN variable is not set in GitLab CI/CD Settings; skipping live STS check."
        exit 0
      fi
      printf '%s' "$AWS_ID_TOKEN" > /tmp/web-identity-token
      export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web-identity-token
      aws sts get-caller-identity
      aws ecr describe-repositories --region "$AWS_DEFAULT_REGION" --query 'repositories[*].repositoryName' --output text || true

build_and_push_ecr:
  stage: build
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://gitlab.com
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ECR_REGISTRY && $AWS_ROLE_ARN'
  before_script:
    - apk add --no-cache aws-cli
    - printf '%s' "$AWS_ID_TOKEN" > /tmp/web-identity-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web-identity-token
    - aws sts get-caller-identity
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  script:
    - |
      for svc in gateway-api flashsale-engine order-worker; do
        IMAGE="$ECR_REGISTRY/kubeticket-dev/$svc"
        docker build -f "services/$svc/Dockerfile" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:dev" services/
        docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$IMAGE:dev"
      done
      FE_IMAGE="$ECR_REGISTRY/kubeticket-dev/frontend"
      docker build -f frontend/Dockerfile -t "$FE_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$FE_IMAGE:dev" frontend/
      docker push "$FE_IMAGE:$CI_COMMIT_SHORT_SHA"
      docker push "$FE_IMAGE:dev"

update_gitops_dev:
  stage: gitops
  image: alpine:3.21
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ECR_REGISTRY && $AWS_ROLE_ARN && $GITOPS_TOKEN'
  script:
    - apk add --no-cache git
    - git config user.name "gitlab-ci-bot"
    - git config user.email "gitlab-ci-bot@kubeticket.local"
    - |
      awk '
        /kubeticket\/(gateway-api|flashsale-engine|order-worker|frontend)/ { update=1 }
        update && /tag:/ { sub(/tag: ".*"/, "tag: \"'"$CI_COMMIT_SHORT_SHA"'\""); update=0 }
        { print }
      ' deploy/charts/kubeticket/values-dev.yaml > /tmp/values-dev.yaml
      mv /tmp/values-dev.yaml deploy/charts/kubeticket/values-dev.yaml
      git diff deploy/charts/kubeticket/values-dev.yaml
      git add deploy/charts/kubeticket/values-dev.yaml
      if ! git diff --cached --quiet; then
        git commit -m "chore(gitops): bump dev image tags to $CI_COMMIT_SHORT_SHA [skip ci]"
        git push "https://oauth2:${GITOPS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_BRANCH}"
      fi
