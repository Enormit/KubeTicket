x-go-env: &go-common-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-kubeticket}:${POSTGRES_PASSWORD:-kubeticket}@postgres:5432/${POSTGRES_DB:-kubeticket}?sslmode=disable
  DB_SIMPLE_PROTOCOL: "true"
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "2"
  REDIS_URL: redis://redis:6379/0
  REDIS_MODE: standalone
  SEAT_HOLD_TTL_SECONDS: ${SEAT_HOLD_TTL_SECONDS:-300}
  CHECKOUT_HOLD_TTL_SECONDS: ${CHECKOUT_HOLD_TTL_SECONDS:-900}
  QUEUE_ADMISSION_RATE: ${QUEUE_ADMISSION_RATE:-50}
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-strong-random-secret}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
  TICKET_QR_HMAC_SECRET: ${TICKET_QR_HMAC_SECRET:-change-me-to-hmac-secret}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stripe}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PAYMENT_WEBHOOK_TOLERANCE_SECONDS: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:-300}
  PROMETHEUS_METRICS_PATH: /metrics
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080

services:
  postgres:
    image: postgres:16-alpine
    container_name: kubeticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kubeticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kubeticket}
      POSTGRES_DB: ${POSTGRES_DB:-kubeticket}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kubeticket} -d ${POSTGRES_DB:-kubeticket}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kubeticket-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --notify-keyspace-events
      - Ex
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-init:
    image: postgres:16-alpine
    container_name: kubeticket-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-kubeticket}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        DB_URL="postgresql://${POSTGRES_USER:-kubeticket}:${POSTGRES_PASSWORD:-kubeticket}@postgres:5432/${POSTGRES_DB:-kubeticket}?sslmode=disable"
        if [ "$$(psql "$$DB_URL" -tAc "SELECT to_regclass('public.users')")" = "" ]; then
          for f in /db/migrations/*.up.sql; do
            echo "Applying $$f..."
            psql "$$DB_URL" -v ON_ERROR_STOP=1 -f "$$f"
          done
        else
          echo "Schema already initialized; skipping migrations."
        fi
        for f in /db/seed/*.sql; do
          echo "Seeding $$f..."
          psql "$$DB_URL" -v ON_ERROR_STOP=1 -f "$$f"
        done

  gateway-api:
    build:
      context: ./services
      dockerfile: gateway-api/Dockerfile
    image: kubeticket/gateway-api:dev
    container_name: kubeticket-gateway-api
    restart: unless-stopped
    environment:
      <<: *go-common-env
      PORT: "8080"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  flashsale-engine:
    build:
      context: ./services
      dockerfile: flashsale-engine/Dockerfile
    image: kubeticket/flashsale-engine:dev
    container_name: kubeticket-flashsale-engine
    restart: unless-stopped
    environment:
      <<: *go-common-env
      PORT: "8081"
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  order-worker:
    build:
      context: ./services
      dockerfile: order-worker/Dockerfile
    image: kubeticket/order-worker:dev
    container_name: kubeticket-order-worker
    restart: unless-stopped
    environment:
      <<: *go-common-env
      PORT: "8082"
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  edge-gateway:
    image: nginx:1.27-alpine
    container_name: kubeticket-edge-gateway
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-api
      - flashsale-engine
      - order-worker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kubeticket/frontend:dev
    container_name: kubeticket-frontend
    profiles: ["full"]
    restart: unless-stopped
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
      BACKEND_INTERNAL_URL: http://edge-gateway:80
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      edge-gateway:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: kubeticket-prometheus
    profiles: ["observability", "full"]
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    container_name: kubeticket-grafana
    profiles: ["observability", "full"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
