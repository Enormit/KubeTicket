map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Health endpoints per microservice
    location = /healthz {
        proxy_pass http://gateway-api:8080/healthz;
    }
    location = /health/gateway {
        proxy_pass http://gateway-api:8080/readyz;
    }
    location = /health/flashsale {
        proxy_pass http://flashsale-engine:8081/readyz;
    }
    location = /health/worker {
        proxy_pass http://order-worker:8082/readyz;
    }

    # WebSocket hub -> flashsale-engine
    location /ws/ {
        proxy_pass http://flashsale-engine:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Flash sale engine endpoints (Waiting Room, Seat Lock, Checkout Submit)
    location ~ ^/api/v1/(waiting-room|holds|checkout) {
        proxy_pass http://flashsale-engine:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Order worker payment webhooks & sandbox completion
    location ~ ^/api/v1/(webhooks|payments) {
        proxy_pass http://order-worker:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Default REST API -> gateway-api
    location /api/ {
        proxy_pass http://gateway-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
